<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dadami — Chainlink Price-Gated Escrow</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Ethers.js v6 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <!-- Environment Config -->
  <script src="config.js"></script>

  <style>
    :root {
      --bg-color: #030712;
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 75%);
      --card-bg: rgba(17, 24, 39, 0.45);
      --border-color: rgba(99, 102, 241, 0.15);
      --border-glow: rgba(99, 102, 241, 0.35);
      --color-primary: #6366f1;
      --color-primary-light: #818cf8;
      --color-accent: #3b82f6; /* Blue for Chainlink */
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --color-success: #10b981;
      --color-warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 25px 2px rgba(99, 102, 241, 0.08);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 35px 5px rgba(99, 102, 241, 0.12);
    }

    .badge {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: var(--color-accent);
      padding: 6px 16px;
      border-radius: 100px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Input Field */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      display: block;
    }

    input {
      width: 100%;
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--color-primary-light);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 28px;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      outline: none;
      margin-bottom: 16px;
    }

    .btn-wallet {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: var(--color-primary-light);
    }

    .btn-wallet:hover {
      background: rgba(99, 102, 241, 0.18);
      border-color: var(--color-primary-light);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: #fff;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .wallet-info {
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      display: none;
    }

    /* Price Card */
    .price-display {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-label {
      font-size: 14px;
      color: var(--text-muted);
    }

    .price-value {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--color-accent);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Project 02 — Escrow & Oracle</span>
    <h1>Price-Gated Escrow</h1>
    <p>Automate disbursement of campaign funds using Chainlink Price Feeds. Payouts trigger automatically when target prices are reached on-chain.</p>

    <!-- Price Feeds Display -->
    <div class="price-display">
      <span class="price-label">Current MATIC/USD Price:</span>
      <span id="current-price" class="price-value">Loading...</span>
    </div>

    <!-- Connect Wallet -->
    <button id="connect-wallet-btn" class="btn btn-wallet">Connect Wallet</button>
    <div id="wallet-info" class="wallet-info"></div>

    <div class="form-group">
      <label for="deposit-amount">Deposit Amount (ETH)</label>
      <input type="number" id="deposit-amount" placeholder="e.g. 0.05" step="0.01">
    </div>

    <div class="form-group">
      <label for="target-price">Target MATIC Price (USD)</label>
      <input type="number" id="target-price" placeholder="e.g. 1.25" step="0.01">
    </div>

    <!-- Create and Disburse triggers -->
    <button id="create-escrow-btn" class="btn btn-primary" disabled>Create Escrow</button>
    <button id="disburse-btn" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981 0%, #34d399 100%); display: none;">Trigger Disbursal</button>
  </div>

  <script>
    const connectBtn = document.getElementById('connect-wallet-btn');
    const walletInfo = document.getElementById('wallet-info');
    const createBtn = document.getElementById('create-escrow-btn');
    const disburseBtn = document.getElementById('disburse-btn');
    const currentPriceText = document.getElementById('current-price');

    let userWalletAddress = null;
    let contractAddress = window.APP_CONFIG.CONTRACT_ADDRESS;

    // Connect Wallet
    connectBtn.addEventListener('click', async () => {
      if (!window.ethereum) {
        alert("Web3 Wallet not found!");
        return;
      }
      try {
        const provider = new ethers.BrowserProvider(window.ethereum);
        const accounts = await provider.send("eth_requestAccounts", []);
        userWalletAddress = accounts[0];

        connectBtn.style.display = 'none';
        walletInfo.innerText = `Connected: ${userWalletAddress}`;
        walletInfo.style.display = 'block';
        createBtn.removeAttribute('disabled');
        
        // Mock current price fetch
        currentPriceText.innerText = "$0.72 USD";
      } catch (err) {
        console.error(err);
      }
    });

    // Create Escrow Trigger
    createBtn.addEventListener('click', () => {
      alert("Creating Price-Gated Escrow. Please approve transaction...");
      // Once created, show simulated Disburse button
      createBtn.style.display = 'none';
      disburseBtn.style.display = 'inline-flex';
    });

    // Trigger Disbursal
    disburseBtn.addEventListener('click', () => {
      alert("Evaluating oracle triggers... Condition satisfied! Disbursing...");
    });
  </script>
</body>
</html>
